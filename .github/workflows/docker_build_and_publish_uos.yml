# 信创 (UOS) 基础镜像专用构建与发布 workflow。
# 与 docker_build_and_test.yml / docker_rc_release.yml 完全独立:
#   - 不调用 docker/docker_*.py 脚本,避免改动 docker_build_test.py / docker_release.py / common.py
#   - 直接调用 docker buildx 构建 + 推送 + Trivy 扫描
#   - 通过 matrix 同时构建两个变体 (jvm + native),两者独立并发、互不 cancel
#       jvm    : docker/jvm/Dockerfile-uos    ->  ${KAFKA_VERSION}-uos
#       native : docker/native/Dockerfile-uos ->  ${KAFKA_VERSION}-native-uos
#   - 镜像仓库: ghcr.io/blueapple168/kafka
#
# 触发:
#   1) push 到 trunk 分支 (本仓库主分支), 且 docker/jvm/** / docker/native/** / docker/server.properties
#      / docker/common-scripts/** / docker/resources/** 或本 workflow 文件变更
#   2) workflow_dispatch 手动触发 (可选指定 kafka_url 与 image_tag,留空使用默认 ${KAFKA_VERSION}{suffix})
#
# 仓库 Secrets (可选, 仅作兜底; jvm 变体使用, native 变体忽略):
#   - JDK_TARBALL_SHA256_X86_64 / JDK_TARBALL_SHA256_AARCH64
#   - JRE_TARBALL_SHA256_X86_64 / JRE_TARBALL_SHA256_AARCH64
#   Temurin 版本号与 SHA256 已改为构建前自动解析 (见 "Resolve Temurin version and checksums"),
#   上游轮转补丁版本时无需再人工同步 Dockerfile ARG 与 Secrets。
#
# 推送目标: ghcr.io/blueapple168/kafka:<image_tag> (linux/amd64, linux/arm64)

name: Docker Build and Publish (UOS)

on:
  push:
    branches:
      - trunk
    paths:
      - 'docker/jvm/**'
      - 'docker/native/**'
      - 'docker/launch'
      - 'docker/jsa_launch'
      - 'docker/server.properties'
      - 'docker/common-scripts/**'
      - 'docker/resources/**'
      - '.github/workflows/docker_build_and_publish_uos.yml'
  workflow_dispatch:
    inputs:
      kafka_url:
        description: Kafka tgz URL (留空使用默认 ${KAFKA_VERSION} release URL)
        required: false
        default: ''
      image_tag:
        description: '镜像 tag（留空时由 variant 自动决定后缀：jvm=-uos，native=-native-uos）'
        required: false
        default: ''

jobs:
  build-and-publish:
    # 只在"本仓库"跑, 避免 fork 出去后别人的 push 也触发构建/推送 ghcr。
    # 用 github.repository_id 而非 github.repository (名字):
    # 仓库已由 blueapple168/kafka 改名为 blueapple168/kafka-docker,
    # 名字判断 `github.repository == 'blueapple168/kafka'` 会变成 false,
    # 导致整个 job 被静默 skip (run 38125744388 就是这样被跳过的)。
    # repository_id 是数字 ID, 改名不变, 更稳。
    if: github.repository_id == '1412943752'
    # 按目标平台选择 runner 架构:
    #   amd64 -> ubuntu-latest (x64)     原生构建
    #   arm64 -> ubuntu-24.04-arm (arm64) 原生构建
    # 关键: arm64 必须用原生 arm64 runner, 不能用 QEMU 模拟。
    # 原因: native 变体的 GraalVM native-image 编译是 CPU/内存密集的长时间操作,
    # 在 QEMU 模拟下 `[6/8] Compiling methods...` 单步就耗时 5904.9s(98min),
    # 整体 `Finished generating 'kafka.Kafka' in 253m 3s`(4.2h), 叠加构建/推送/
    # 拉取/扫描后总时长逼近 GitHub 默认 6h job 上限, 导致 job 被 cancel
    # (attempt 2 实测生命期 6h00m28s 被砍)。改用原生 arm64 runner 后,
    # 编译按真实 CPU 执行, 耗时降到分钟级。
    # (GitHub 对 public 仓库的 arm64 runner 免费且不限量)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # variant 决定: Dockerfile 路径、默认 tag 后缀、是否校验 Temurin SHA256 secrets
        variant: [jvm, native]
        # platform 作为独立维度: amd64 与 arm64 拆成不同 job,互不拖累。
        # 原因: 若与 amd64 同 job 双平台构建, arm64 失败会连带丢弃 amd64 已构建成果。
        # 拆开后各自独立重试。
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    concurrency:
      # 不同 variant × platform 独立,避免互相 cancel
      group: docker-publish-uos-${{ matrix.variant }}-${{ matrix.platform }}-${{ github.ref }}
      cancel-in-progress: true
    # 显式超时, 避免 job 卡死时被 GitHub 6h 上限静默 cancel(状态一直挂在 in_progress)。
    # 原生 runner 下 native 变体约 20-30min, 给足余量到 150min;
    # 超时即明确 failure, 比"永远 in_progress"更利于排查。
    timeout-minutes: 150
    env:
      # Kafka 版本号集中维护: 升级 Kafka 时只需改这一处,
      #   KAFKA_TARBALL_URL 与 IMAGE_TAG 默认值会在 Resolve 步骤里据此拼接
      KAFKA_VERSION: '4.3.1'
      # Temurin tarball 镜像根, 与 docker/jvm/Dockerfile-uos 的 ARG JAVA_MIRROR_BASE_URL 保持同一来源
      JAVA_MIRROR_BASE_URL: 'https://mirrors.tuna.tsinghua.edu.cn/Adoptium/25'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        # 仅在 runner 架构 ≠ 目标平台架构时才需要 QEMU 模拟。
        # 当前 matrix 已把 runner 与 platform 一一对齐
        #   linux/amd64 -> ubuntu-latest (x64)      原生
        #   linux/arm64 -> ubuntu-24.04-arm (arm64) 原生
        # 因此两个 job 都不会命中此条件, QEMU 实际被完全跳过。
        # 保留该步骤是为了: 若将来把某平台改回 x64 runner 跑跨架构构建,
        # 该步骤会自动补上 QEMU, 无需再改 workflow。
        if: matrix.runner != 'ubuntu-24.04-arm' && matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Kafka URL
        id: kafka-url
        run: |
          kafka_url="${{ github.event.inputs.kafka_url }}"
          if [ -z "$kafka_url" ]; then
            kafka_url="https://archive.apache.org/dist/kafka/${KAFKA_VERSION}/kafka_2.13-${KAFKA_VERSION}.tgz"
          fi
          echo "url=$kafka_url" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: image-tag
        run: |
          image_tag="${{ github.event.inputs.image_tag }}"
          if [ -z "$image_tag" ]; then
            if [ "${{ matrix.variant }}" = "native" ]; then
              image_tag="${KAFKA_VERSION}-native-uos"
            else
              image_tag="${KAFKA_VERSION}-uos"
            fi
          fi
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

          # 平台后缀: linux/amd64 -> amd64, linux/arm64 -> arm64
          # 单平台 job 各自推 ${tag}-<arch>, 最后由 merge job 合成 multi-arch manifest
          platform_arch="${{ matrix.platform }}"
          platform_arch="${platform_arch##*/}"
          echo "arch=$platform_arch" >> "$GITHUB_OUTPUT"
          echo "arch_tag=${image_tag}-${platform_arch}" >> "$GITHUB_OUTPUT"

      # jvm 变体专属: 动态解析 Temurin (Adoptium) tarball 的版本号与 SHA256。
      #
      # 历史问题 (run 42459521849): jvm 变体两个架构都在 "Build and push" 步骤约 40s 内失败,
      # 而 native 变体成功 —— 因为 native 运行的是 AOT 二进制, 不依赖 Temurin。
      # 直接原因: 清华镜像把 25.0.4.1_1 轮转成 25.0.5_8 后, Dockerfile 里写死的
      #   ${JAVA_MIRROR_BASE_URL}/jdk/x64/linux/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz
      # 变成 404, wget 立即退出, set -eux 中断构建。
      # 原方案把版本号写死在 Dockerfile ARG、把 4 个校验和写死在仓库 Secrets,
      # 每次上游轮转补丁版本都要人工同步两处, 否则构建必挂。
      # 现改为构建前自动解析, 两者同源、不会错配:
      #   版本号: 从镜像目录页 HTML 中提取 (清华镜像没有 JSON 索引, 文件名内嵌在页面里)
      #   校验和: 按版本号从 Adoptium 官方 API 查询
      # Secrets 保留为兜底 (解析失败时使用), 不再是必填项。
      - name: Resolve Temurin version and checksums
        id: temurin
        if: matrix.variant == 'jvm'
        env:
          MIRROR_BASE: ${{ env.JAVA_MIRROR_BASE_URL }}
          FALLBACK_JDK_SHA_X64: ${{ secrets.JDK_TARBALL_SHA256_X86_64 }}
          FALLBACK_JDK_SHA_AARCH64: ${{ secrets.JDK_TARBALL_SHA256_AARCH64 }}
          FALLBACK_JRE_SHA_X64: ${{ secrets.JRE_TARBALL_SHA256_X86_64 }}
          FALLBACK_JRE_SHA_AARCH64: ${{ secrets.JRE_TARBALL_SHA256_AARCH64 }}
        run: |
          set -euo pipefail
          MIRROR_BASE="${MIRROR_BASE%/}"

          # 从目录页提取该 kind/arch 下所有可用版本, 取最大者
          # 文件名形如 OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz
          resolve_version() {
            local kind=$1 arch=$2 page
            page=$(curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
                     "${MIRROR_BASE}/${kind}/${arch}/linux/") || return 1
            printf '%s' "$page" \
              | grep -oE "OpenJDK25U-${kind}_${arch}_linux_hotspot_[0-9]+(\.[0-9]+)*_[0-9]+\.tar\.gz" \
              | sed -E 's/.*hotspot_([0-9.]+_[0-9]+)\.tar\.gz/\1/' \
              | sort -V | tail -n1
          }

          # 按版本号查 sha256 (版本号里的 "_" 在 URL 中需转义成 "%2B")
          resolve_sha() {
            local kind=$1 arch=$2 ver=$3 api_ver
            [ -n "$ver" ] || return 1
            api_ver=${ver/_/%2B}
            curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
              "https://api.adoptium.net/v3/assets/release_name/eclipse/jdk-${api_ver}?architecture=${arch}&image_type=${kind}&os=linux&vendor=eclipse" \
              | jq -r '.binaries[0].package.checksum // empty'
          }

          jdk_version=$(resolve_version jdk x64 || true)
          jre_version=$(resolve_version jre x64 || true)
          echo "mirror resolved: jdk=${jdk_version:-<none>} jre=${jre_version:-<none>}"

          jdk_sha_x64=$(resolve_sha jdk x64 "${jdk_version}" || true)
          jdk_sha_aarch64=$(resolve_sha jdk aarch64 "${jdk_version}" || true)
          jre_sha_x64=$(resolve_sha jre x64 "${jre_version}" || true)
          jre_sha_aarch64=$(resolve_sha jre aarch64 "${jre_version}" || true)

          # 解析失败时回退到仓库 Secrets (兼容未联网/接口改版等场景)
          jdk_sha_x64=${jdk_sha_x64:-${FALLBACK_JDK_SHA_X64:-}}
          jdk_sha_aarch64=${jdk_sha_aarch64:-${FALLBACK_JDK_SHA_AARCH64:-}}
          jre_sha_x64=${jre_sha_x64:-${FALLBACK_JRE_SHA_X64:-}}
          jre_sha_aarch64=${jre_sha_aarch64:-${FALLBACK_JRE_SHA_AARCH64:-}}

          missing=''
          [ -n "${jdk_version}" ] || missing="${missing} JDK_VERSION"
          [ -n "${jre_version}" ] || missing="${missing} JRE_VERSION"
          [ -n "${jdk_sha_x64}" ] || missing="${missing} JDK_TARBALL_SHA256_X86_64"
          [ -n "${jdk_sha_aarch64}" ] || missing="${missing} JDK_TARBALL_SHA256_AARCH64"
          [ -n "${jre_sha_x64}" ] || missing="${missing} JRE_TARBALL_SHA256_X86_64"
          [ -n "${jre_sha_aarch64}" ] || missing="${missing} JRE_TARBALL_SHA256_AARCH64"
          if [ -n "${missing}" ]; then
            echo "::error::无法解析 Temurin 版本/校验和, 缺失:${missing}"
            echo "::error::请检查镜像 ${MIRROR_BASE} 是否可访问, 或配置对应 Secrets 作为兜底"
            exit 1
          fi

          {
            echo "jdk-version=${jdk_version}"
            echo "jre-version=${jre_version}"
            echo "jdk-sha256-x64=${jdk_sha_x64}"
            echo "jdk-sha256-aarch64=${jdk_sha_aarch64}"
            echo "jre-sha256-x64=${jre_sha_x64}"
            echo "jre-sha256-aarch64=${jre_sha_aarch64}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Temurin resolved"
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| JDK | ${jdk_version} |"
            echo "| JRE | ${jre_version} |"
            echo "| jdk/x64 | \`${jdk_sha_x64}\` |"
            echo "| jdk/aarch64 | \`${jdk_sha_aarch64}\` |"
            echo "| jre/x64 | \`${jre_sha_x64}\` |"
            echo "| jre/aarch64 | \`${jre_sha_aarch64}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push (${{ matrix.platform }})
        id: build
        env:
          KAFKA_URL: ${{ steps.kafka-url.outputs.url }}
          JDK_VERSION: ${{ steps.temurin.outputs.jdk-version }}
          JRE_VERSION: ${{ steps.temurin.outputs.jre-version }}
          JDK_TARBALL_SHA256_X86_64: ${{ steps.temurin.outputs.jdk-sha256-x64 }}
          JDK_TARBALL_SHA256_AARCH64: ${{ steps.temurin.outputs.jdk-sha256-aarch64 }}
          JRE_TARBALL_SHA256_X86_64: ${{ steps.temurin.outputs.jre-sha256-x64 }}
          JRE_TARBALL_SHA256_AARCH64: ${{ steps.temurin.outputs.jre-sha256-aarch64 }}
        run: |
          set -eux
          # step outputs 用 shell 变量接收, 避免在 buildx 命令里反复内联插值出错
          ARCH_TAG='${{ steps.image-tag.outputs.arch_tag }}'
          echo "ARCH_TAG=${ARCH_TAG}"
          # Dockerfile-uos 里 `COPY *kafka.tgz` 要求 context 根存在该 glob 的匹配文件,
          # 但 tarball 是在 RUN 阶段用 wget 下载的 (COPY 早于 RUN)。
          # 因此构建前需要在 context 根放一个占位文件, 下载后会被覆盖/清理。
          touch docker/kafka.tgz

          # variant -> Dockerfile 路径映射
          if [ "${{ matrix.variant }}" = "native" ]; then
            dockerfile='docker/native/Dockerfile-uos'
            # native 不需要 Temurin (运行时是 AOT 原生二进制,无 JDK/JRE)
            extra_temurin_args=()
          else
            dockerfile='docker/jvm/Dockerfile-uos'
            # jvm 需要把解析到的 Temurin 版本与 SHA256 透传给 Dockerfile-uos 内的 ARG
            for v in JDK_VERSION JRE_VERSION JDK_TARBALL_SHA256_X86_64 JDK_TARBALL_SHA256_AARCH64 \
                     JRE_TARBALL_SHA256_X86_64 JRE_TARBALL_SHA256_AARCH64; do
              if [ -z "${!v:-}" ]; then
                echo "::error::Temurin 版本/校验和缺失: ${v} 为空 (Resolve Temurin 步骤未产出?)"
                exit 1
              fi
            done
            extra_temurin_args=(
              --build-arg "JDK_VERSION=${JDK_VERSION}"
              --build-arg "JRE_VERSION=${JRE_VERSION}"
              --build-arg "JAVA_MIRROR_BASE_URL=${JAVA_MIRROR_BASE_URL}"
              --build-arg "JDK_TARBALL_SHA256_X86_64=${JDK_TARBALL_SHA256_X86_64}"
              --build-arg "JDK_TARBALL_SHA256_AARCH64=${JDK_TARBALL_SHA256_AARCH64}"
              --build-arg "JRE_TARBALL_SHA256_X86_64=${JRE_TARBALL_SHA256_X86_64}"
              --build-arg "JRE_TARBALL_SHA256_AARCH64=${JRE_TARBALL_SHA256_AARCH64}"
            )
          fi

          echo "::group::Building variant=${{ matrix.variant }} platform=${{ matrix.platform }} with ${dockerfile}"
          # 单平台构建, 推到带架构后缀的临时 tag; merge job 再合成 multi-arch manifest。
          # --metadata-file 收集本次构建的 digest, 供 merge job 使用。
          docker buildx build \
            -f "${dockerfile}" \
            --build-arg "KAFKA_VERSION=${KAFKA_VERSION}" \
            --build-arg "kafka_url=${KAFKA_URL}" \
            "${extra_temurin_args[@]}" \
            --build-arg "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --platform "${{ matrix.platform }}" \
            --tag "ghcr.io/blueapple168/kafka:${ARCH_TAG}" \
            --metadata-file "${GITHUB_WORKSPACE}/buildx-${ARCH_TAG}.json" \
            --push \
            docker/
          echo "::endgroup::"

          # 记录 digest 到输出, 供 merge job 拼装 manifest 时引用
          digest=$(jq -r '."containerimage.digest"' "${GITHUB_WORKSPACE}/buildx-${ARCH_TAG}.json")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "arch_tag=${ARCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "::notice::${ARCH_TAG} -> ${digest}"

      - name: Run CVE scan (Trivy)
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-type: 'image'
          scan-ref: 'ghcr.io/blueapple168/kafka:${{ steps.image-tag.outputs.arch_tag }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          output: 'scan_report_uos_${{ matrix.variant }}_${{ steps.image-tag.outputs.arch }}.txt'
          # exit-code: '1' 会在发现 CRITICAL/HIGH 时直接 fail 整个 job,
          # 且报告文件可能尚未落盘 -> 后续 Upload 步骤报 "No files were found"。
          # 改为 '0': 扫描结果只作为报告产出, 不阻断发布 (由人工审查).
          exit-code: '0'
          # 关键: 显式声明被扫描镜像的平台。
          # action 内部会 `docker pull $scanRef` + `docker save`, 若不指定平台,
          # docker 按 runner 架构(amd64)解析 manifest, 遇到 arm64 单架构镜像会报
          #   no matching manifest for linux/amd64 in the manifest list entries
          # (这正是 jvm/native arm64 job 在 Trivy 步骤失败的原因)。
          # trivy-env 透传 TRIVY_PLATFORM 进沙箱容器, 覆盖 Trivy 默认的 runtime
          # 平台推导 (Trivy 约定: 任意 CLI flag 可用 TRIVY_<FLAG> 环境变量设置)。
          trivy-env: |
            TRIVY_PLATFORM=${{ matrix.platform }}
        # step 级 env: 作用到 action 的 entrypoint.sh, 覆盖它内部的
        # `docker pull` / `docker save` / `docker run`, 确保取到 arm64 镜像层。
        # 注意: env 必须与 with 同级, 不能写进 with 块内部。
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}

      - name: Upload CVE scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan_report_uos_${{ matrix.variant }}_${{ steps.image-tag.outputs.arch }}.txt
          path: scan_report_uos_${{ matrix.variant }}_${{ steps.image-tag.outputs.arch }}.txt
          if-no-files-found: warn

  # 把各平台 job 推的 ${tag}-amd64 / ${tag}-arm64 合成最终 multi-arch manifest。
  # 用 if: always() 而非依赖 needs 的默认成功语义: 这样某个 variant 的某个 arch
  # 失败时, 不会连带阻止其它 variant 的 manifest 合并。
  # 合并前显式检查两个 arch tag 是否都已存在于 registry, 缺一即跳过并给出提示。
  merge-manifest:
    # 与 build-and-publish 同样用数字 repository_id 判断 (改名免疫)。
    if: ${{ always() && github.repository_id == '1412943752' }}
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [jvm, native]
    env:
      KAFKA_VERSION: '4.3.1'
    steps:
      - name: Resolve image tag
        id: image-tag
        run: |
          image_tag="${{ github.event.inputs.image_tag }}"
          if [ -z "$image_tag" ]; then
            if [ "${{ matrix.variant }}" = "native" ]; then
              image_tag="${KAFKA_VERSION}-native-uos"
            else
              image_tag="${KAFKA_VERSION}-uos"
            fi
          fi
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -eux
          repo='ghcr.io/blueapple168/kafka'
          image_tag='${{ steps.image-tag.outputs.tag }}'

          # 逐个确认两个 arch tag 均已推送成功; 缺任一则跳过本 variant 的合并
          # (另一个 variant 的 merge 仍会正常执行, 因为 job 之间相互独立)
          missing=0
          for arch in amd64 arm64; do
            if ! docker buildx imagetools inspect "${repo}:${image_tag}-${arch}" >/dev/null 2>&1; then
              echo "::warning::${repo}:${image_tag}-${arch} 不存在 (该平台构建可能失败), 跳过合并"
              missing=1
            fi
          done
          if [ "${missing}" = "1" ]; then
            echo "::notice::variant=${{ matrix.variant }} 缺少平台镜像, 未生成 multi-arch manifest"
            exit 0
          fi

          # 合成 linux/amd64 + linux/arm64 的 manifest list 到最终 tag
          docker buildx imagetools create \
            --tag "${repo}:${image_tag}" \
            "${repo}:${image_tag}-amd64" \
            "${repo}:${image_tag}-arm64"
          echo "::notice::multi-arch manifest published: ${repo}:${image_tag}"
          docker buildx imagetools inspect "${repo}:${image_tag}"
